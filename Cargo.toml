[package]
name = "keplearn"
version = "0.1.1"
edition = "2021"
description = "Deterministic symbolic regression by best-first recursive reduction"
license = "MIT"
repository = "https://github.com/owls-on-wires/keplearn"
authors = ["Chandler Freeman <chandler@mnty.sh>"]

[lib]
name = "keplearn"
path = "src/lib.rs"

[[bin]]
name = "keplearn"
path = "src/bin/keplearn.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
