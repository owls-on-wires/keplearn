name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Each release asset is an archive holding one folder, keplearn-<platform>/,
# with the binary, README.md, CHANGELOG.md, LICENSE, docs/ and examples/.
# Archive names carry no version, so .../releases/latest/download/<name>
# always works. The release notes are the version's CHANGELOG section.
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: keplearn-linux-x86_64
            archive: keplearn-linux-x86_64.tar.gz
          - os: macos-latest
            name: keplearn-macos-universal
            archive: keplearn-macos-universal.tar.gz
          - os: windows-latest
            name: keplearn-windows-x86_64
            archive: keplearn-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, static musl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p "${{ matrix.name }}"
          cp target/x86_64-unknown-linux-musl/release/keplearn "${{ matrix.name }}/keplearn"
          strip "${{ matrix.name }}/keplearn"
      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p "${{ matrix.name }}"
          lipo -create -output "${{ matrix.name }}/keplearn" \
            target/x86_64-apple-darwin/release/keplearn \
            target/aarch64-apple-darwin/release/keplearn
          strip "${{ matrix.name }}/keplearn"
      - name: Build (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release
          mkdir -p "${{ matrix.name }}"
          cp target/release/keplearn.exe "${{ matrix.name }}/keplearn.exe"
      - name: Package
        shell: bash
        run: |
          cp README.md CHANGELOG.md LICENSE "${{ matrix.name }}/"
          cp -r docs "${{ matrix.name }}/docs"
          cp -r examples "${{ matrix.name }}/examples"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ matrix.archive }}" "${{ matrix.name }}"
          else
            tar -czf "${{ matrix.archive }}" "${{ matrix.name }}"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber
